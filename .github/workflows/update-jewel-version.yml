# Keeps the version on the landing page in step with what is published on Maven Central.
# Anything derived from the Jewel repo is generated, never hand-copied (see STYLE.md);
# this is the generator for the header chip and the Gradle snippet.
#
# It commits straight to master and deploys, but only after proving the change is the
# version and nothing else. verify-version-bump.mjs substitutes the new version back to
# the old one and requires the result to be byte-identical to the committed file. If any
# other byte moved, the deploy does not happen and a person looks at it.
name: Update Jewel version

on:
  schedule:
    # Daily, off the hour: scheduled runs are queued at busy times and start late.
    # GitHub disables cron in a public repository after 60 days without repository
    # activity, and emails the owner first. Run workflow below switches it back on.
    - cron: '23 5 * * *'
  workflow_dispatch:

# The default for this repository is read-only. Committing the bump needs write.
permissions:
  contents: write

# Two runs pushing to master would race. Let a run in progress finish.
concurrency:
  group: update-jewel-version
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Job-level so the deploy step can check it in `if`; a step's own env cannot be read
    # by that step's condition. Absent secret means commit-only, which is the old behaviour.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - id: jewel
        name: Read the published version from Maven Central
        run: node update-version.mjs src/Main.dc.html

      - name: Rebuild the landing page
        if: steps.jewel.outputs.changed == 'true'
        run: |
          node build-site.mjs src/Main.dc.html public
          node check-links.mjs

      # Two gates. The file list catches anything outside the two expected files. The
      # round trip then proves that inside them, only the version moved: substitute the new
      # version back to the old and the bytes must match what is committed. The file list
      # alone is not enough, because the rebuild regenerates public/index.html from source,
      # so a source edit committed without a rebuild would ride along in the same two files.
      - name: Prove the diff is only the version
        if: steps.jewel.outputs.changed == 'true'
        run: |
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed"
          printf 'public/index.html\nsrc/Main.dc.html\n' > "$RUNNER_TEMP/expected"
          if ! diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"; then
            echo "::error::unexpected files in the diff, refusing to commit"
            exit 1
          fi
          node verify-version-bump.mjs \
            '${{ steps.jewel.outputs.oldVersion }}' '${{ steps.jewel.outputs.oldArtifact }}' \
            '${{ steps.jewel.outputs.version }}'    '${{ steps.jewel.outputs.artifact }}'
          git --no-pager diff --stat

      - name: Commit
        if: steps.jewel.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.jewel.outputs.version }}
          ARTIFACT: ${{ steps.jewel.outputs.artifact }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Main.dc.html public/index.html
          git commit -m "Update the Jewel version to $VERSION" \
                     -m "Published on Maven Central as $ARTIFACT."
          git push

      # Deploy whenever the Cloudflare token is present. After a version bump this
      # ships the new chip; when unchanged it retries a prior failed deploy that left
      # master ahead of production (changed=false would otherwise skip forever).
      - name: Deploy
        if: env.CF_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Report
        env:
          CHANGED: ${{ steps.jewel.outputs.changed }}
          ARTIFACT: ${{ steps.jewel.outputs.artifact }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            if [ "$CHANGED" = 'true' ]; then
              echo "Landing page updated to $ARTIFACT and deployed." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Already on $ARTIFACT; redeployed current master (retry path)." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$CHANGED" = 'true' ]; then
            echo "Landing page updated to $ARTIFACT, committed but not deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy automatically," >> "$GITHUB_STEP_SUMMARY"
            echo "or publish it with \`npx wrangler@latest deploy\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Already on $ARTIFACT. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
