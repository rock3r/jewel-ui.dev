# Deploy jewel-ui.dev whenever master moves (site content, docs, API sync).
# Uses a Cloudflare API token scoped to this Workers project only — see README.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# deployments:write lets the job register a GitHub Deployment for the environment
# below. Only the public URL is recorded — no Cloudflare account IDs or tokens.
permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-jewel-ui-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: jewel-ui.dev
      url: https://jewel-ui.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@latest deploy

      - name: Missing secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
          exit 1
