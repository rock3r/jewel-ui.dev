name: Feature request
description: Suggest an improvement to jewel-ui.dev (docs, landing page, or API reference).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for **this site**. For Jewel library features, use [YouTrack JEWEL](https://youtrack.jetbrains.com/issues/JEWEL).
  - type: input
    id: page
    attributes:
      label: Related page (optional)
      description: A docs or site URL this idea relates to, if any.
      placeholder: https://jewel-ui.dev/docs/...
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What are you trying to do that the site does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
    validations:
      required: false
